alertmanager:
  enabled: false

grafana:
  enabled: true

  persistence:
    enabled: true
    type: sts
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL 

  extraConfigmapMounts:
    - name: grafana-alerting-provisioning
      mountPath: /etc/grafana/provisioning/alerting
      configMap: grafana-alerting-provisioning
      readOnly: true       

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 10d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true