
apiVersion: 1

contactPoints:
  - orgId: 1
    name: dasmeta-slack
    receivers:
      - uid: dasmeta-slack-webhook
        type: slack
        settings:
          recipient: "#dasmeta-alerts"
          url: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          username: "DasMeta Grafana"
          title: |
            {{ template "slack.default.title" . }}
          text: |
            {{ template "slack.default.text" . }}

policies:
  - orgId: 1
    receiver: dasmeta-slack
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: dasmeta-kubernetes-alerts
    folder: DasMeta
    interval: 1m
    rules:
      - uid: high_cpu_usage
        title: High CPU Usage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                100 * (1 - avg by (instance) (
                  rate(node_cpu_seconds_total{mode="idle"}[5m])
                ))
              instant: true
              refId: A
              range: false

          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Kubernetes node CPU usage is high
          description: Node CPU usage has exceeded 80% for 5 minutes.
        labels:
          severity: warning
          team: devops

      - uid: high_memory_usage
        title: High Memory Usage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                100 * (1 - (
                  node_memory_MemAvailable_bytes
                  /
                  node_memory_MemTotal_bytes
                ))
              instant: true
              refId: A
              range: false

          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Kubernetes node memory usage is high
          description: Node memory usage has exceeded 85% for 5 minutes.
        labels:
          severity: warning
          team: devops
