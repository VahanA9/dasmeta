
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $filename := base $path }}
{{- $dashboard := trimSuffix ".json" $filename }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $dashboard }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ $filename }}: |-
{{ $.Files.Get $path | nindent 4 }}
---
{{- end }}
